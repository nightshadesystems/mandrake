# Lint and build on every push and pull request. Mirrors `just ci`.
#
# GitHub has no illumos runner, so this covers the host target only plus an
# illumos type-check. Integration tests and media builds run on the OmniOS
# build host (docs/build.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads channel, components, and targets from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-unknown-illumos

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace

      - name: test
        run: cargo test --workspace

      - name: check illumos target
        run: cargo check --workspace --all-targets --target x86_64-unknown-illumos

  console:
    name: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      # Version comes from the packageManager field in console/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: console/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: api docs up to date
        run: pnpm check-api-docs

      - name: build
        run: pnpm build

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck is preinstalled on the Ubuntu runner image
      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck -S style -x -P SCRIPTDIR
