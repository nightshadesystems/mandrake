[workspace]
resolver = "3"
members = [
    "crates/mandraked",
    "crates/mandrakectl",
    "crates/mandrake-core",
    "crates/mandrake-zones",
    "crates/mandrake-bhyve",
    "crates/mandrake-net",
    "crates/mandrake-zfs",
    "crates/mandrake-images",
    "crates/mandrake-smf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Nightshade Systems"]
repository = "https://github.com/nightshadesystems/mandrake"
homepage = "https://nightshade.systems"
publish = false

[workspace.dependencies]
# Internal crates
mandrake-core = { path = "crates/mandrake-core" }
mandrake-zones = { path = "crates/mandrake-zones" }
mandrake-bhyve = { path = "crates/mandrake-bhyve" }
mandrake-net = { path = "crates/mandrake-net" }
mandrake-zfs = { path = "crates/mandrake-zfs" }
mandrake-images = { path = "crates/mandrake-images" }
mandrake-smf = { path = "crates/mandrake-smf" }

# Sanctioned external set (spec §14).
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "sync", "time", "net"] }
axum = { version = "0.8", features = ["ws", "macros"] }
# No `bundled` here: mandraked links the OmniOS libsqlite3 on illumos and
# enables `bundled` for other targets itself (ADR-0009).
rusqlite = "0.40"
rust-embed = { version = "8", features = ["mime-guess"] }

# Approved additions for Phase 2 (signed off 2026-09-01; ADR-0007..0009).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"
base64 = "0.23"
subtle = "2"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "limit", "request-id"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# rustls-no-provider: the plain `rustls` feature pulls in aws-lc-rs, which
# needs cmake and a C toolchain; the ring provider is installed at startup.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "server", "server-auto", "service"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
