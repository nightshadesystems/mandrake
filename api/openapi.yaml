components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mandrake_session
      description: Console session issued at login (ADR-0007)
    bearerToken:
      type: http
      scheme: bearer
      description: "API token `mdk_...` for CLI and automation; hashed at rest"

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-chosen key, scoped to the actor, kept 24 hours. A repeat with
        the same key and body returns the original response; a different
        body returns 422.
      schema:
        type: string
        maxLength: 128
    CsrfHeader:
      name: X-Mandrake-Request
      in: header
      required: false
      description: Must be `1` on mutating requests authenticated by the session cookie
      schema:
        type: string
        enum: ["1"]
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's next_cursor
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

  responses:
    Problem:
      description: Error as RFC 7807 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the next attempt is accepted
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Accepted:
      description: Operation started; poll the job or watch the event stream
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Job"

  schemas:
    Id:
      type: string
      format: uuid
      description: Globally unique object identifier, stored in illumos alongside the object

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC

    Role:
      type: string
      enum: [admin, operator, viewer]

    Problem:
      type: object
      description: |
        RFC 7807 problem details. `type` is `about:blank` for plain HTTP
        errors, or `https://mandrake.nightshade.systems/problems/<slug>` for
        application errors such as `invalid-credentials`, `locked`,
        `idempotency-mismatch`, `last-admin`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        request_id:
          type: string
          description: Matches the daemon log and the audit row

    Page:
      type: object
      description: Cursor-paginated envelope; concrete list responses extend this with a typed items array
      required: [items]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to fetch the next page; null on the last page

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password

    Actor:
      type: object
      description: Who is acting. `root` over the socket has no user id.
      required: [username, role, via]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        via:
          type: string
          enum: [session, token, socket]
        token_id:
          $ref: "#/components/schemas/Id"

    Session:
      type: object
      required: [actor]
      properties:
        actor:
          $ref: "#/components/schemas/Actor"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        idle_expires_at:
          $ref: "#/components/schemas/Timestamp"

    User:
      type: object
      required: [id, username, role, disabled, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        display_name:
          type: string
        disabled:
          type: boolean
        locked_until:
          type: [string, "null"]
          format: date-time
          description: Set while the user is locked out after failed logins
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    UserCreate:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          pattern: "^[a-z_][a-z0-9_.-]{0,31}$"
          description: Lowercase, starts with a letter or underscore, at most 32 characters
        password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
        role:
          $ref: "#/components/schemas/Role"
        display_name:
          type: string
          maxLength: 128

    UserUpdate:
      type: object
      description: Every field optional; omitted fields are unchanged
      properties:
        role:
          $ref: "#/components/schemas/Role"
        display_name:
          type: string
          maxLength: 128
        disabled:
          type: boolean

    PasswordChange:
      type: object
      required: [new_password]
      properties:
        current_password:
          type: string
          format: password
          description: Required when changing one's own password
        new_password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password

    UserList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"

    Token:
      type: object
      required: [id, user_id, name, prefix, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        user_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        prefix:
          type: string
          description: First eight characters of the secret after `mdk_`, for identification
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time

    TokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        user_id:
          $ref: "#/components/schemas/Id"
        expires_in_seconds:
          type: [integer, "null"]
          minimum: 60
          description: Omit or null for a token that does not expire

    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: "The full bearer token `mdk_...`; shown once"

    TokenList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Token"

    ObjectRef:
      type: object
      description: The object an audit entry or event is about
      required: [kind]
      properties:
        kind:
          type: string
          description: Resource family singular, for example `user`, `token`, `vm`, `system`
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string

    AuditEntry:
      type: object
      required: [id, at, actor, action, object, result]
      properties:
        id:
          type: string
          description: Monotonic; usable as an audit cursor
        at:
          $ref: "#/components/schemas/Timestamp"
        actor:
          $ref: "#/components/schemas/Actor"
        action:
          type: string
          description: "`<kind>.<verb>`, for example `user.create`, `token.revoke`, `auth.login`"
        object:
          $ref: "#/components/schemas/ObjectRef"
        before:
          type: [object, "null"]
          description: Summary of the object before the call; secrets never appear
        after:
          type: [object, "null"]
          description: Summary of the object after the call
        result:
          type: string
          enum: [ok, denied, failed]
        detail:
          type: string
        request_id:
          type: string
        source:
          type: string
          description: Client address, or `socket`

    AuditList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"

    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    Job:
      type: object
      description: A long-running operation; returned with 202
      required: [id, state, kind, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/JobState"
        kind:
          type: string
          description: Operation family, for example image.import or vm.create
        target:
          $ref: "#/components/schemas/ObjectRef"
        progress:
          type: number
          minimum: 0
          maximum: 1
        message:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        error:
          $ref: "#/components/schemas/Problem"

    JobList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Job"

    Event:
      type: object
      description: One frame on the event stream
      required: [id, at, kind]
      properties:
        id:
          type: string
          description: Monotonic; pass as `since` to resume
        at:
          $ref: "#/components/schemas/Timestamp"
        kind:
          type: string
          description: "`<kind>.<verb>` as in audit actions, plus `job.progress`"
        object:
          $ref: "#/components/schemas/ObjectRef"
        actor:
          $ref: "#/components/schemas/Actor"
        data:
          type: object
          description: Kind-specific payload, for example the Job for `job.*`

    Metadata:
      type: object
      description: Per-object metadata held in SQLite, not in illumos (ADR-0002)
      properties:
        display_name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        notes:
          type: string

    SystemInfo:
      type: object
      required: [id, hostname, product, version, omnios_release, boot_environment, uptime_seconds, time]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        hostname:
          type: string
        product:
          type: string
          const: mandrake
        version:
          type: string
          description: Mandrake release version
        omnios_release:
          type: string
          examples: [r151054]
        boot_environment:
          type: string
          description: Active boot environment name
        uptime_seconds:
          type: integer
          minimum: 0
        time:
          $ref: "#/components/schemas/Timestamp"
        timezone:
          type: string
          examples: [UTC]

    SystemResources:
      type: object
      required: [cpus, load_avg, memory]
      properties:
        cpus:
          type: integer
          minimum: 1
        load_avg:
          type: array
          description: 1, 5, and 15 minute load averages
          items:
            type: number
          minItems: 3
          maxItems: 3
        memory:
          type: object
          required: [total_bytes, free_bytes]
          properties:
            total_bytes:
              type: integer
              minimum: 0
            free_bytes:
              type: integer
              minimum: 0
        sampled_at:
          $ref: "#/components/schemas/Timestamp"

    # ----------------------------------------------------------- storage

    Bytes:
      type: integer
      minimum: 0
      description: A size in bytes, exact (from `-p` parsable output)

    Device:
      type: object
      description: A disk as `diskinfo` reports it
      required: [name, size_bytes, removable]
      properties:
        name:
          type: string
          description: Device name, for example `c1t0d0`
          examples: [c1t0d0]
        vendor:
          type: string
        product:
          type: string
        serial:
          type: string
        size_bytes:
          $ref: "#/components/schemas/Bytes"
        removable:
          type: boolean
        solid_state:
          type: boolean
        pool:
          type: [string, "null"]
          description: Pool using this device, if any

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    PoolHealth:
      type: string
      enum: [ONLINE, DEGRADED, FAULTED, OFFLINE, UNAVAIL, REMOVED, SUSPENDED]

    VdevType:
      type: string
      enum: [root, disk, file, mirror, raidz1, raidz2, raidz3, log, cache, spare, replacing, spare-group]

    Vdev:
      type: object
      description: One node of a pool's vdev tree
      required: [name, type, state, children]
      properties:
        name:
          type: string
          description: As `zpool status` prints it (`mirror-0`, `c1t0d0`)
        type:
          $ref: "#/components/schemas/VdevType"
        state:
          $ref: "#/components/schemas/PoolHealth"
        read_errors:
          type: integer
        write_errors:
          type: integer
        checksum_errors:
          type: integer
        note:
          type: string
          description: Trailing note such as `(resilvering)`
        children:
          type: array
          items:
            $ref: "#/components/schemas/Vdev"

    ScanStatus:
      type: object
      description: The current or last scrub or resilver
      required: [function, state]
      properties:
        function:
          type: string
          enum: [scrub, resilver]
        state:
          type: string
          enum: [in_progress, finished, canceled]
        progress:
          type: number
          minimum: 0
          maximum: 1
        started_at:
          $ref: "#/components/schemas/Timestamp"
        finished_at:
          type: [string, "null"]
          format: date-time
        errors:
          type: integer
        rate_bytes_per_second:
          type: integer
        summary:
          type: string
          description: The `scan:` line verbatim

    Pool:
      type: object
      required: [id, name, health, size_bytes, allocated_bytes, free_bytes, protected, vdevs]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        health:
          $ref: "#/components/schemas/PoolHealth"
        size_bytes:
          $ref: "#/components/schemas/Bytes"
        allocated_bytes:
          $ref: "#/components/schemas/Bytes"
        free_bytes:
          $ref: "#/components/schemas/Bytes"
        fragmentation_percent:
          type: integer
        capacity_percent:
          type: integer
        dedup_ratio:
          type: number
        protected:
          type: boolean
          description: "`rpool`: no destroy or vdev changes through the API"
        vdevs:
          $ref: "#/components/schemas/Vdev"
        scan:
          $ref: "#/components/schemas/ScanStatus"
        status_text:
          type: string
          description: The `status:` and `action:` lines from `zpool status`, when present
        metadata:
          $ref: "#/components/schemas/Metadata"

    PoolList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Pool"

    VdevSpec:
      type: object
      description: One top-level vdev to create
      required: [type, devices]
      properties:
        type:
          type: string
          enum: [stripe, mirror, raidz1, raidz2, raidz3, log, cache, spare]
        devices:
          type: array
          minItems: 1
          items:
            type: string
            description: Device name as in `Device.name`

    PoolCreate:
      type: object
      required: [name, vdevs]
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9_.:-]{0,254}$"
        vdevs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VdevSpec"
        ashift:
          type: integer
          minimum: 9
          maximum: 16
          description: Default 12
        compression:
          type: string
          description: Root dataset compression, default `lz4`
        force:
          type: boolean
          default: false
          description: "`zpool create -f`: reuse devices with old labels"
        metadata:
          $ref: "#/components/schemas/Metadata"

    PoolDestroy:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Must equal the pool's name

    DatasetKind:
      type: string
      enum: [filesystem, volume]

    Dataset:
      type: object
      required: [id, name, pool, kind, used_bytes, available_bytes, referenced_bytes, protected, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          description: Full dataset name
        pool:
          type: string
        kind:
          $ref: "#/components/schemas/DatasetKind"
        mountpoint:
          type: [string, "null"]
        mounted:
          type: boolean
        used_bytes:
          $ref: "#/components/schemas/Bytes"
        available_bytes:
          $ref: "#/components/schemas/Bytes"
        referenced_bytes:
          $ref: "#/components/schemas/Bytes"
        logical_used_bytes:
          $ref: "#/components/schemas/Bytes"
        quota_bytes:
          type: [integer, "null"]
        reservation_bytes:
          type: [integer, "null"]
        compression:
          type: string
        compress_ratio:
          type: number
        atime:
          type: boolean
        recordsize_bytes:
          type: integer
        volsize_bytes:
          type: [integer, "null"]
          description: Volumes only
        volblocksize_bytes:
          type: [integer, "null"]
          description: Volumes only
        origin:
          type: [string, "null"]
          description: Snapshot this dataset was cloned from
        protected:
          type: boolean
          description: Root datasets, boot environments, and Mandrake's own datasets
        created_at:
          $ref: "#/components/schemas/Timestamp"
        metadata:
          $ref: "#/components/schemas/Metadata"

    DatasetCreate:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          description: Full name, for example `tank/vms/disk0`
        kind:
          $ref: "#/components/schemas/DatasetKind"
        volsize_bytes:
          type: integer
          minimum: 1
          description: Required for volumes
        volblocksize_bytes:
          type: integer
        compression:
          type: string
        quota_bytes:
          type: integer
        reservation_bytes:
          type: integer
        mountpoint:
          type: string
        atime:
          type: boolean
        recordsize_bytes:
          type: integer
        sparse:
          type: boolean
          description: "Volumes: `zfs create -s`"
        create_parents:
          type: boolean
          default: false
          description: "`zfs create -p`"
        metadata:
          $ref: "#/components/schemas/Metadata"

    DatasetUpdate:
      type: object
      description: Every field optional; omitted fields are unchanged
      properties:
        volsize_bytes:
          type: integer
          description: "Volumes: grow only"
        compression:
          type: string
        quota_bytes:
          type: [integer, "null"]
          description: null removes the quota
        reservation_bytes:
          type: [integer, "null"]
        mountpoint:
          type: string
        atime:
          type: boolean
        metadata:
          $ref: "#/components/schemas/Metadata"

    DatasetList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Dataset"

    Snapshot:
      type: object
      required: [id, name, dataset, short_name, used_bytes, referenced_bytes, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          description: Full name `dataset@snap`
        dataset:
          type: string
        short_name:
          type: string
          description: The part after `@`
        used_bytes:
          $ref: "#/components/schemas/Bytes"
        referenced_bytes:
          $ref: "#/components/schemas/Bytes"
        clones:
          type: array
          items:
            type: string
          description: Datasets cloned from this snapshot
        created_at:
          $ref: "#/components/schemas/Timestamp"
        metadata:
          $ref: "#/components/schemas/Metadata"

    SnapshotCreate:
      type: object
      required: [dataset, name]
      properties:
        dataset:
          type: string
        name:
          type: string
          description: The part after `@`
          pattern: "^[a-zA-Z0-9_.:-]{1,255}$"
        recursive:
          type: boolean
          default: false
        metadata:
          $ref: "#/components/schemas/Metadata"

    SnapshotList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Snapshot"

    # ----------------------------------------------------------- network

    LinkName:
      type: string
      pattern: "^[a-zA-Z][a-zA-Z0-9_]{0,30}[0-9]$"
      description: A datalink name; illumos requires it to end in a digit

    LinkKind:
      type: string
      enum: [phys, aggr, vlan, etherstub, vnic, other]

    LinkState:
      type: string
      enum: [up, down, unknown]

    Link:
      type: object
      description: One datalink. Fields not meaningful for a kind are absent.
      required: [id, name, kind, state, protected]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LinkKind"
        state:
          $ref: "#/components/schemas/LinkState"
        over:
          type: array
          items:
            type: string
          description: Links this one sits on; several for an aggr, one otherwise
        mtu:
          type: integer
        mac:
          type: string
          description: "Colon-separated, lowercase"
        mac_mode:
          type: string
          enum: [auto, fixed, random, factory]
          description: VNICs
        vid:
          type: integer
          description: VLAN id for VLAN links and tagged VNICs
        speed_mbps:
          type: integer
          description: Physical links and aggrs
        duplex:
          type: string
          enum: [full, half, unknown]
        device:
          type: string
          description: Driver instance behind a physical link, for example `e1000g0`
        media:
          type: string
        aggr:
          $ref: "#/components/schemas/AggrInfo"
        zone:
          type: [string, "null"]
          description: Zone the link is assigned to, if not the global zone
        protected:
          type: boolean
          description: Part of the path to the management address
        metadata:
          $ref: "#/components/schemas/Metadata"

    AggrInfo:
      type: object
      required: [policy, lacp_mode, lacp_timer, ports]
      properties:
        policy:
          type: string
          description: "`L2`, `L3`, `L4`, or combinations such as `L2,L3`"
        lacp_mode:
          type: string
          enum: [off, active, passive]
        lacp_timer:
          type: string
          enum: [short, long]
        ports:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name:
                type: string
              state:
                type: string
                description: "`attached`, `standby`, or as `dladm show-aggr -x` prints it"
              speed_mbps:
                type: integer

    LinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    LinkUpdate:
      type: object
      properties:
        mtu:
          type: integer
          minimum: 576
          maximum: 9216
        metadata:
          $ref: "#/components/schemas/Metadata"

    AggrCreate:
      type: object
      required: [name, ports]
      properties:
        name:
          $ref: "#/components/schemas/LinkName"
        ports:
          type: array
          minItems: 1
          items:
            type: string
        policy:
          type: string
          default: L4
        lacp_mode:
          type: string
          enum: [off, active, passive]
          default: active
        lacp_timer:
          type: string
          enum: [short, long]
          default: short
        metadata:
          $ref: "#/components/schemas/Metadata"

    VlanCreate:
      type: object
      required: [name, vid, over]
      properties:
        name:
          $ref: "#/components/schemas/LinkName"
        vid:
          type: integer
          minimum: 1
          maximum: 4094
        over:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"

    VnicCreate:
      type: object
      required: [name, over]
      properties:
        name:
          $ref: "#/components/schemas/LinkName"
        over:
          type: string
        mac:
          type: string
          description: Pin a MAC; omitted means auto
        vid:
          type: integer
          minimum: 1
          maximum: 4094
        mtu:
          type: integer
        metadata:
          $ref: "#/components/schemas/Metadata"

    AddressKind:
      type: string
      enum: [static, dhcp, addrconf]

    Address:
      type: object
      required: [id, name, interface, kind, family, state, protected]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          description: The address object, for example `vnic0/v4`
        interface:
          type: string
          description: The link (IP interface) it belongs to
        kind:
          $ref: "#/components/schemas/AddressKind"
        family:
          type: string
          enum: [inet, inet6]
        address:
          type: string
          description: "`a.b.c.d/prefix` or `xx::/prefix`; absent until DHCP or autoconf assigns one"
        state:
          type: string
          description: "`ok`, `tentative`, `duplicate`, `inaccessible`, `disabled`, ..."
        persistent:
          type: boolean
        protected:
          type: boolean
          description: The address the daemon listens on
        metadata:
          $ref: "#/components/schemas/Metadata"

    AddressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Address"

    AddressCreate:
      type: object
      required: [interface, kind]
      properties:
        interface:
          type: string
          description: Link name; the IP interface is created if missing
        kind:
          $ref: "#/components/schemas/AddressKind"
        address:
          type: string
          description: Required for `static`, with prefix length
        alias:
          type: string
          pattern: "^[a-zA-Z0-9_]{1,16}$"
          description: The part after `/` in the address object name; default `v4` or `v6`
        temporary:
          type: boolean
          default: false
          description: Do not persist across reboot
        metadata:
          $ref: "#/components/schemas/Metadata"

    Route:
      type: object
      required: [id, destination, family, kind]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        destination:
          type: string
          description: "`default` or a network with prefix"
        gateway:
          type: string
        family:
          type: string
          enum: [inet, inet6]
        interface:
          type: string
        flags:
          type: string
          description: As `netstat -rn` prints them
        kind:
          type: string
          enum: [static, interface, dynamic]
          description: Only `static` routes are managed
        persistent:
          type: boolean

    RouteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Route"

    RouteCreate:
      type: object
      required: [destination, gateway]
      properties:
        destination:
          type: string
          description: "`default` or a network with prefix"
        gateway:
          type: string
