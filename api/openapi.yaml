      tags: [images]
      operationId: listImages
      summary: List imported images
      description: The catalogue of images on this host, every state. Any role.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ImageType"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ImageState"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /images/import:
    post:
      tags: [images]
      operationId: importImage
      summary: Import an image
      description: |
        Role `operator`. Either `source_id` with `name` and `version` picks
        an entry from a verified source's catalogue, or `url` with `sha256`
        and `type` imports directly; the operator vouches for the hash.
        Returns 202 with the job; the image appears at once in state
        `pending` and moves through `downloading`, `verifying`, `importing`
        to `ready` or `failed` (ADR-0012).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageImport"
      responses:
        "202":
          description: Import started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /images/available:
    get:
      tags: [images]
      operationId: listAvailableImages
      summary: Images offered by the sources
      description: |
        The cached catalogues of every enabled source, with whether each
        entry is already imported. Refresh a source to update it. Any role.
      parameters:
        - name: source_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Id"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ImageType"
      responses:
        "200":
          description: Catalogue entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueEntryList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /images/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [images]
      operationId: getImage
      summary: Get an image
      description: Any role.
      responses:
        "200":
          description: The image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [images]
      operationId: updateImage
      summary: Change metadata
      description: Role `operator`.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Metadata"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [images]
      operationId: deleteImage
      summary: Delete an image
      description: |
        Role `operator`. Destroys the image dataset, zvol, or file. Refused
        with 409 `busy` while a zone or VM is cloned from it. A failed or
        pending import is cancelled and its staging file removed.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /images/sources:
    get:
      tags: [images]
      operationId: listImageSources
      summary: List image sources
      description: Built-in and user-added sources. Any role.
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSourceList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [images]
      operationId: createImageSource
      summary: Add an image source
      description: |
        Role `operator`. The index is fetched at once; the response carries
        the outcome in `last_error`. Without `public_key` the source is
        unverified and cannot be imported from (ADR-0012).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageSourceCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSource"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /images/sources/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [images]
      operationId: getImageSource
      summary: Get a source
      description: Any role.
      responses:
        "200":
          description: The source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSource"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [images]
      operationId: updateImageSource
      summary: Change a source
      description: Role `operator`. Built-in sources accept `enabled` and `public_key` only.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageSourceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSource"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [images]
      operationId: deleteImageSource
      summary: Remove a source
      description: Role `operator`. Built-in sources cannot be removed; disable them. Imported images stay.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /images/sources/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [images]
      operationId: refreshImageSource
      summary: Fetch the source's index now
      description: |
        Role `operator`. Fetches and verifies the index synchronously and
        replaces the cached catalogue. A fetch or signature failure leaves
        the old catalogue in place and is reported in `last_error`.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: The source after the refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSource"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ------------------------------------------------------------- zones

  /zones:
    get:
      tags: [zones]
      operationId: listZones
      summary: List zones
      description: Every zone except the `bhyve` brand, which is the VM family. Any role.
      parameters:
        - name: brand
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ZoneBrand"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ZoneState"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Zones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [zones]
      operationId: createZone
      summary: Create and install a zone
      description: |
        Role `operator`. Writes the zonecfg synchronously, so the zone is
        listed at once in state `configured`, then installs it in the job
        returned with 202: an lx zone or a native zone with `image_id`
        clones the image; a native zone without one installs from the
        global zone's packages. `autoboot` and `start` control what happens
        after install (ADR-0012).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneCreate"
      responses:
        "202":
          description: Install started; the job's target is the new zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /zones/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [zones]
      operationId: getZone
      summary: Get a zone
      description: Any role.
      responses:
        "200":
          description: The zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [zones]
      operationId: updateZone
      summary: Change configuration or metadata
      description: |
        Role `operator`. Applied to the zonecfg at once. NIC and cap changes
        take effect at the next boot of a running zone; `autoboot` and
        metadata immediately.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [zones]
      operationId: deleteZone
      summary: Delete a zone
      description: |
        Role `operator`. Halts, uninstalls, and removes the configuration
        in the job returned with 202. The zone's datasets stay unless
        `purge` is set (spec §7).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - name: purge
          in: query
          required: false
          description: Also destroy the zone's datasets
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: Delete started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /zones/{id}/start:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [zones]
      operationId: startZone
      summary: Boot a zone
      description: Role `operator`. `zoneadm boot` as a job.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "202":
          description: Boot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /zones/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [zones]
      operationId: stopZone
      summary: Shut a zone down
      description: |
        Role `operator`. A clean `zoneadm shutdown` as a job; with `force`
        an immediate `zoneadm halt`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneStop"
      responses:
        "202":
          description: Stop started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /zones/{id}/restart:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [zones]
      operationId: restartZone
      summary: Reboot a zone
      description: Role `operator`. `zoneadm shutdown -r` as a job.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "202":
          description: Restart started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /zones/{id}/console:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [zones]
      operationId: zoneConsole
      summary: Zone console (WebSocket)
      description: |
        Role `operator`. Upgrade to a WebSocket attached to the zone
        console (`zlogin -C`). Server frames are terminal output; client
        text or binary frames are keystrokes, except a text frame that
        parses as `{"resize": {"cols": N, "rows": N}}`, which resizes the
        terminal. One session per zone; a second connect is refused with
        409 `busy`. Authenticate as for `/events`.
      parameters:
        - name: cols
          in: query
          required: false
          schema:
            type: integer
            minimum: 20
            maximum: 500
            default: 80
        - name: rows
          in: query
          required: false
          schema:
            type: integer
            minimum: 5
            maximum: 200
            default: 24
      responses:
        "101":
          description: Switching Protocols
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"


  # ------------------------------------------------------------- vms

  /vms:
    get:
      tags: [vms]
      operationId: listVms
      summary: List VMs
      description: Every bhyve-brand zone. Any role.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ZoneState"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: VMs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [vms]
      operationId: createVm
      summary: Create a VM
      description: |
        Role `operator`. Writes the zonecfg synchronously, so the VM is
        listed at once in state `configured`, then in the job returned with
        202 creates the disks (a clone of a `vm-raw` image, or blank zvols),
        installs, and boots when `start` is set (ADR-0013).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmCreate"
      responses:
        "202":
          description: Create started; the job's target is the new VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [vms]
      operationId: getVm
      summary: Get a VM
      description: Any role.
      responses:
        "200":
          description: The VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vm"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [vms]
      operationId: updateVm
      summary: Change sizing, firmware, NICs, or metadata
      description: |
        Role `operator`. Written to the zonecfg at once; sizing, firmware,
        and NIC changes take effect at the next boot of a running VM.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vm"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [vms]
      operationId: deleteVm
      summary: Delete a VM
      description: |
        Role `operator`. Halts, uninstalls, and removes the configuration
        in the job returned with 202. Disks stay unless `purge` (spec §7).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - name: purge
          in: query
          required: false
          description: Also destroy the VM's dataset and disks
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: Delete started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/start:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [vms]
      operationId: startVm
      summary: Boot a VM
      description: Role `operator`. As a job.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "202":
          description: Boot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [vms]
      operationId: stopVm
      summary: Shut a VM down
      description: |
        Role `operator`. An ACPI shutdown request that waits for the guest,
        as a job; with `force` the VM is halted at once.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneStop"
      responses:
        "202":
          description: Stop started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/restart:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [vms]
      operationId: restartVm
      summary: Reboot a VM
      description: Role `operator`. An ACPI shutdown then boot, as a job.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "202":
          description: Restart started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/reset:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [vms]
      operationId: resetVm
      summary: Hard reset a VM
      description: Role `operator`. Halt then boot, without asking the guest, as a job.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "202":
          description: Reset started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/disks:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [vms]
      operationId: addVmDisk
      summary: Add a disk
      description: |
        Role `operator`. A blank zvol of `size_bytes`, or a clone of a
        `vm-raw` image. Attached at the next boot of a running VM.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmDiskAdd"
      responses:
        "201":
          description: The VM with the new disk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vm"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/disks/{index}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
    patch:
      tags: [vms]
      operationId: resizeVmDisk
      summary: Grow a disk
      description: Role `operator`. Volumes only grow; the guest sees the new size at the next boot.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmDiskResize"
      responses:
        "200":
          description: The VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vm"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [vms]
      operationId: removeVmDisk
      summary: Detach a disk
      description: |
        Role `operator`. The boot disk cannot be removed. The zvol stays
        unless `purge`.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - name: purge
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vm"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/cdroms:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [vms]
      operationId: attachVmCdrom
      summary: Attach an ISO
      description: Role `operator`. A `vm-iso` image. Seen by the guest at the next boot.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmCdromAttach"
      responses:
        "201":
          description: The VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vm"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/cdroms/{index}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: index
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
    delete:
      tags: [vms]
      operationId: detachVmCdrom
      summary: Detach an ISO
      description: Role `operator`.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: The VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vm"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/snapshots:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [vms]
      operationId: listVmSnapshots
      summary: List a VM's snapshots
      description: Recursive snapshots of the VM dataset, newest last. Any role.
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmSnapshotList"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [vms]
      operationId: createVmSnapshot
      summary: Snapshot every disk at once
      description: |
        Role `operator`. `zfs snapshot -r` over the VM dataset. Taken while
        the guest runs it is crash-consistent: what a power cut would leave.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmSnapshotCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmSnapshot"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/snapshots/{snapshot}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: snapshot
        in: path
        required: true
        description: The snapshot id, as under /storage/snapshots
        schema:
          $ref: "#/components/schemas/Id"
    delete:
      tags: [vms]
      operationId: deleteVmSnapshot
      summary: Destroy a VM snapshot
      description: Role `operator`. Destroys it on every disk.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Destroyed
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/snapshots/{snapshot}/rollback:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: snapshot
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Id"
    post:
      tags: [vms]
      operationId: rollbackVmSnapshot
      summary: Roll every disk back
      description: Role `operator`. The VM must be stopped. Newer snapshots are destroyed.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Rolled back
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/serial:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [vms]
      operationId: vmSerial
      summary: Serial console (WebSocket)
      description: |
        Role `operator`. As `/zones/{id}/console`: terminal output as
        server frames, input as client frames, `{"resize": ...}` to resize.
        One session per VM; 409 `busy` otherwise.
      parameters:
        - name: cols
          in: query
          required: false
          schema:
            type: integer
            minimum: 20
            maximum: 500
            default: 80
        - name: rows
          in: query
          required: false
          schema:
            type: integer
            minimum: 5
            maximum: 200
            default: 24
      responses:
        "101":
          description: Switching Protocols
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /vms/{id}/vnc:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [vms]
      operationId: vmVnc
      summary: VNC (WebSocket)
      description: |
        Role `operator`. Upgrade to a WebSocket carrying the guest's RFB
        stream as binary frames in both directions, for noVNC. The VNC
        server is reachable only through this proxy (spec §12). Refused
        with 409 while the VM is not running or another session is attached.
      responses:
        "101":
          description: Switching Protocols
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"


components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mandrake_session
      description: Console session issued at login (ADR-0007)
    bearerToken:
      type: http
      scheme: bearer
      description: "API token `mdk_...` for CLI and automation; hashed at rest"

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    BootEnvironmentName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,62}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-chosen key, scoped to the actor, kept 24 hours. A repeat with
        the same key and body returns the original response; a different
        body returns 422.
      schema:
        type: string
        maxLength: 128
    CsrfHeader:
      name: X-Mandrake-Request
      in: header
      required: false
      description: Must be `1` on mutating requests authenticated by the session cookie
      schema:
        type: string
        enum: ["1"]
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's next_cursor
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

  responses:
    Problem:
      description: Error as RFC 7807 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the next attempt is accepted
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Accepted:
      description: Operation started; poll the job or watch the event stream
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Job"

  schemas:
    Id:
      type: string
      format: uuid
      description: Globally unique object identifier, stored in illumos alongside the object

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC

    Role:
      type: string
      enum: [admin, operator, viewer]

    Problem:
      type: object
      description: |
        RFC 7807 problem details. `type` is `about:blank` for plain HTTP
        errors, or `https://mandrake.nightshade.systems/problems/<slug>` for
        application errors such as `invalid-credentials`, `locked`,
        `idempotency-mismatch`, `last-admin`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        request_id:
          type: string
          description: Matches the daemon log and the audit row

    Page:
      type: object
      description: Cursor-paginated envelope; concrete list responses extend this with a typed items array
      required: [items]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: [string, "null"]
          description: Pass as cursor to fetch the next page; null on the last page

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password

    Actor:
      type: object
      description: Who is acting. `root` over the socket has no user id.
      required: [username, role, via]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        via:
          type: string
          enum: [session, token, socket]
        token_id:
          $ref: "#/components/schemas/Id"

    Session:
      type: object
      required: [actor]
      properties:
        actor:
          $ref: "#/components/schemas/Actor"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        idle_expires_at:
          $ref: "#/components/schemas/Timestamp"

    User:
      type: object
      required: [id, username, role, disabled, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        display_name:
          type: string
        disabled:
          type: boolean
        locked_until:
          type: [string, "null"]
          format: date-time
          description: Set while the user is locked out after failed logins
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    UserCreate:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          pattern: "^[a-z_][a-z0-9_.-]{0,31}$"
          description: Lowercase, starts with a letter or underscore, at most 32 characters
        password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
        role:
          $ref: "#/components/schemas/Role"
        display_name:
          type: string
          maxLength: 128

    UserUpdate:
      type: object
      description: Every field optional; omitted fields are unchanged
      properties:
        role:
          $ref: "#/components/schemas/Role"
        display_name:
          type: string
          maxLength: 128
        disabled:
          type: boolean

    PasswordChange:
      type: object
      required: [new_password]
      properties:
        current_password:
          type: string
          format: password
          description: Required when changing one's own password
        new_password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password

    UserList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"

    Token:
      type: object
      required: [id, user_id, name, prefix, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        user_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        prefix:
          type: string
          description: First eight characters of the secret after `mdk_`, for identification
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time

    TokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        user_id:
          $ref: "#/components/schemas/Id"
        expires_in_seconds:
          type: [integer, "null"]
          minimum: 60
          description: Omit or null for a token that does not expire

    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: "The full bearer token `mdk_...`; shown once"

    TokenList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Token"

    ObjectRef:
      type: object
      description: The object an audit entry or event is about
      required: [kind]
      properties:
        kind:
          type: string
          description: Resource family singular, for example `user`, `token`, `vm`, `system`
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string

    AuditEntry:
      type: object
      required: [id, at, actor, action, object, result]
      properties:
        id:
          type: string
          description: Monotonic; usable as an audit cursor
        at:
          $ref: "#/components/schemas/Timestamp"
        actor:
          $ref: "#/components/schemas/Actor"
        action:
          type: string
          description: "`<kind>.<verb>`, for example `user.create`, `token.revoke`, `auth.login`"
        object:
          $ref: "#/components/schemas/ObjectRef"
        before:
          type: [object, "null"]
          description: Summary of the object before the call; secrets never appear
        after:
          type: [object, "null"]
          description: Summary of the object after the call
        result:
          type: string
          enum: [ok, denied, failed]
        detail:
          type: string
        request_id:
          type: string
        source:
          type: string
          description: Client address, or `socket`

    AuditList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"

    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    Job:
      type: object
      description: A long-running operation; returned with 202
      required: [id, state, kind, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/JobState"
        kind:
          type: string
          description: Operation family, for example image.import or vm.create
        target:
          $ref: "#/components/schemas/ObjectRef"
        progress:
          type: number
          minimum: 0
          maximum: 1
        message:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        error:
          $ref: "#/components/schemas/Problem"

    JobList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Job"

    Event:
      type: object
      description: One frame on the event stream
      required: [id, at, kind]
      properties:
        id:
          type: string
          description: Monotonic; pass as `since` to resume
        at:
          $ref: "#/components/schemas/Timestamp"
        kind:
          type: string
          description: "`<kind>.<verb>` as in audit actions, plus `job.progress`"
        object:
          $ref: "#/components/schemas/ObjectRef"
        actor:
          $ref: "#/components/schemas/Actor"
        data:
          type: object
          description: Kind-specific payload, for example the Job for `job.*`

    Metadata:
      type: object
      description: Per-object metadata held in SQLite, not in illumos (ADR-0002)
      properties:
        display_name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        notes:
          type: string

    SystemInfo:
      type: object
      required: [id, hostname, product, version, omnios_release, boot_environment, uptime_seconds, time]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        hostname:
          type: string
        product:
          type: string
          const: mandrake
        version:
          type: string
          description: Mandrake release version
        omnios_release:
          type: string
          examples: [r151054]
        boot_environment:
          type: string
          description: Active boot environment name
        uptime_seconds:
          type: integer
          minimum: 0
        time:
          $ref: "#/components/schemas/Timestamp"
        timezone:
          type: string
          examples: [UTC]

    SystemSettings:
      type: object
      required: [hostname, ntp_servers]
      properties:
        hostname:
          type: string
        timezone:
          type: string
          examples: [UTC]
        ntp_servers:
          type: array
          items:
            type: string
          description: The `server` lines of chrony.conf

    SystemUpdate:
      type: object
      description: Absent fields are unchanged.
      properties:
        hostname:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,62}$"
        timezone:
          type: string
          description: A zoneinfo name such as `UTC` or `Europe/Berlin`
        ntp_servers:
          type: array
          items:
            type: string
          description: Replaces the list; empty disables NTP

    TlsInfo:
      type: object
      required: [subject, issuer, not_before, not_after, fingerprint, self_signed]
      properties:
        subject:
          type: string
        issuer:
          type: string
        not_before:
          $ref: "#/components/schemas/Timestamp"
        not_after:
          $ref: "#/components/schemas/Timestamp"
        fingerprint:
          type: string
          description: SHA-256 of the leaf certificate, `AA:BB:...`
        self_signed:
          type: boolean
          description: Generated by the daemon rather than uploaded

    TlsUpload:
      type: object
      required: [certificate_pem, key_pem]
      properties:
        certificate_pem:
          type: string
          description: The leaf first, then any intermediates
        key_pem:
          type: string
          description: PKCS#8 or traditional RSA/EC key; must match the leaf

    BootEnvironment:
      type: object
      required: [id, name, active, booted, space_bytes, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        active:
          type: boolean
          description: Boots next (`beadm` flag R)
        booted:
          type: boolean
          description: The running BE (`beadm` flag N)
        mountpoint:
          type: string
        space_bytes:
          type: integer
          format: int64
        policy:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"

    BootEnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BootEnvironment"

    BootEnvironmentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,62}$"

    UpdatePackage:
      type: object
      required: [name, action]
      properties:
        name:
          type: string
          description: Package FMRI stem, for example `system/mandrake/daemon`
        action:
          type: string
          enum: [install, update, remove]
        old_version:
          type: string
        new_version:
          type: string

    UpdatePlan:
      type: object
      required: [packages, reboot_required, boot_environment, checked_at]
      properties:
        packages:
          type: array
          items:
            $ref: "#/components/schemas/UpdatePackage"
        reboot_required:
          type: boolean
        boot_environment:
          type: string
          description: Name the apply will give the new BE (ADR-0015)
        mandrake_version:
          type: string
          description: The Mandrake version the plan moves to, when it changes it
        checked_at:
          $ref: "#/components/schemas/Timestamp"
        raw:
          type: string
          description: The `pkg update -nv` text, kept when the parser could not read it

    UpdateState:
      type: object
      required: [checking, applying]
      properties:
        plan:
          $ref: "#/components/schemas/UpdatePlan"
        checking:
          type: boolean
        applying:
          type: boolean
        check_job:
          $ref: "#/components/schemas/Id"
        apply_job:
          $ref: "#/components/schemas/Id"
        applied_at:
          $ref: "#/components/schemas/Timestamp"
        applied_boot_environment:
          type: string
          description: The BE the last apply created; boots next until a reboot
        previous_boot_environment:
          type: string
          description: The BE that was active before the last apply; the rollback target

    SystemResources:
      type: object
      required: [cpus, load_avg, memory]
      properties:
        cpus:
          type: integer
          minimum: 1
        load_avg:
          type: array
          description: 1, 5, and 15 minute load averages
          items:
            type: number
          minItems: 3
          maxItems: 3
        memory:
          type: object
          required: [total_bytes, free_bytes]
          properties:
            total_bytes:
              type: integer
              minimum: 0
            free_bytes:
              type: integer
              minimum: 0
        sampled_at:
          $ref: "#/components/schemas/Timestamp"

    # ----------------------------------------------------------- storage

    Bytes:
      type: integer
      minimum: 0
      description: A size in bytes, exact (from `-p` parsable output)

    Device:
      type: object
      description: A disk as `diskinfo` reports it
      required: [name, size_bytes, removable]
      properties:
        name:
          type: string
          description: Device name, for example `c1t0d0`
          examples: [c1t0d0]
        vendor:
          type: string
        product:
          type: string
        serial:
          type: string
        size_bytes:
          $ref: "#/components/schemas/Bytes"
        removable:
          type: boolean
        solid_state:
          type: boolean
        pool:
          type: [string, "null"]
          description: Pool using this device, if any

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    PoolHealth:
      type: string
      enum: [ONLINE, DEGRADED, FAULTED, OFFLINE, UNAVAIL, REMOVED, SUSPENDED, AVAIL, INUSE]

    VdevType:
      type: string
      enum: [root, disk, file, mirror, raidz1, raidz2, raidz3, log, cache, spare, replacing, spare-group]

    Vdev:
      type: object
      description: One node of a pool's vdev tree
      required: [name, type, state, children]
      properties:
        name:
          type: string
          description: As `zpool status` prints it (`mirror-0`, `c1t0d0`)
        type:
          $ref: "#/components/schemas/VdevType"
        state:
          $ref: "#/components/schemas/PoolHealth"
        read_errors:
          type: integer
        write_errors:
          type: integer
        checksum_errors:
          type: integer
        note:
          type: string
          description: Trailing note such as `(resilvering)`
        children:
          type: array
          items:
            $ref: "#/components/schemas/Vdev"

    ScanStatus:
      type: object
      description: The current or last scrub or resilver
      required: [function, state]
      properties:
        function:
          type: string
          enum: [scrub, resilver]
        state:
          type: string
          enum: [in_progress, finished, canceled]
        progress:
          type: number
          minimum: 0
          maximum: 1
        started_at:
          $ref: "#/components/schemas/Timestamp"
        finished_at:
          type: [string, "null"]
          format: date-time
        errors:
          type: integer
        rate_bytes_per_second:
          type: integer
        summary:
          type: string
          description: The `scan:` line verbatim

    Pool:
      type: object
      required: [id, name, health, size_bytes, allocated_bytes, free_bytes, protected, vdevs]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        health:
          $ref: "#/components/schemas/PoolHealth"
        size_bytes:
          $ref: "#/components/schemas/Bytes"
        allocated_bytes:
          $ref: "#/components/schemas/Bytes"
        free_bytes:
          $ref: "#/components/schemas/Bytes"
        fragmentation_percent:
          type: integer
        capacity_percent:
          type: integer
        dedup_ratio:
          type: number
        protected:
          type: boolean
          description: "`rpool`: no destroy or vdev changes through the API"
        vdevs:
          $ref: "#/components/schemas/Vdev"
        scan:
          $ref: "#/components/schemas/ScanStatus"
        status_text:
          type: string
          description: The `status:` and `action:` lines from `zpool status`, when present
        metadata:
          $ref: "#/components/schemas/Metadata"

    PoolList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Pool"

    VdevSpec:
      type: object
      description: One top-level vdev to create
      required: [type, devices]
      properties:
        type:
          type: string
          enum: [stripe, mirror, raidz1, raidz2, raidz3, log, cache, spare]
        devices:
          type: array
          minItems: 1
          items:
            type: string
            description: Device name as in `Device.name`

    PoolCreate:
      type: object
      required: [name, vdevs]
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9_.:-]{0,254}$"
        vdevs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VdevSpec"
        ashift:
          type: integer
          minimum: 9
          maximum: 16
          description: Default 12
        compression:
          type: string
          description: Root dataset compression, default `lz4`
        force:
          type: boolean
          default: false
          description: "`zpool create -f`: reuse devices with old labels"
        metadata:
          $ref: "#/components/schemas/Metadata"

    PoolDestroy:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Must equal the pool's name

    DatasetKind:
      type: string
      enum: [filesystem, volume]

    Dataset:
      type: object
      required: [id, name, pool, kind, used_bytes, available_bytes, referenced_bytes, protected, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          description: Full dataset name
        pool:
          type: string
        kind:
          $ref: "#/components/schemas/DatasetKind"
        mountpoint:
          type: [string, "null"]
        mounted:
          type: boolean
        used_bytes:
          $ref: "#/components/schemas/Bytes"
        available_bytes:
          $ref: "#/components/schemas/Bytes"
        referenced_bytes:
          $ref: "#/components/schemas/Bytes"
        logical_used_bytes:
          $ref: "#/components/schemas/Bytes"
        quota_bytes:
          type: [integer, "null"]
        reservation_bytes:
          type: [integer, "null"]
        compression:
          type: string
        compress_ratio:
          type: number
        atime:
          type: boolean
        recordsize_bytes:
          type: integer
        volsize_bytes:
          type: [integer, "null"]
          description: Volumes only
        volblocksize_bytes:
          type: [integer, "null"]
          description: Volumes only
        origin:
          type: [string, "null"]
          description: Snapshot this dataset was cloned from
        protected:
          type: boolean
          description: Root datasets, boot environments, and Mandrake's own datasets
        created_at:
          $ref: "#/components/schemas/Timestamp"
        metadata:
          $ref: "#/components/schemas/Metadata"

    DatasetCreate:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          description: Full name, for example `tank/vms/disk0`
        kind:
          $ref: "#/components/schemas/DatasetKind"
        volsize_bytes:
          type: integer
          minimum: 1
          description: Required for volumes
        volblocksize_bytes:
          type: integer
        compression:
          type: string
        quota_bytes:
          type: integer
        reservation_bytes:
          type: integer
        mountpoint:
          type: string
        atime:
          type: boolean
        recordsize_bytes:
          type: integer
        sparse:
          type: boolean
          description: "Volumes: `zfs create -s`"
        create_parents:
          type: boolean
          default: false
          description: "`zfs create -p`"
        metadata:
          $ref: "#/components/schemas/Metadata"

    DatasetUpdate:
      type: object
      description: Every field optional; omitted fields are unchanged
      properties:
        volsize_bytes:
          type: integer
          description: "Volumes: grow only"
        compression:
          type: string
        quota_bytes:
          type: [integer, "null"]
          description: null removes the quota
        reservation_bytes:
          type: [integer, "null"]
        mountpoint:
          type: string
        atime:
          type: boolean
        metadata:
          $ref: "#/components/schemas/Metadata"

    DatasetList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Dataset"

    Snapshot:
      type: object
      required: [id, name, dataset, short_name, used_bytes, referenced_bytes, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          description: Full name `dataset@snap`
        dataset:
          type: string
        short_name:
          type: string
          description: The part after `@`
        used_bytes:
          $ref: "#/components/schemas/Bytes"
        referenced_bytes:
          $ref: "#/components/schemas/Bytes"
        clones:
          type: array
          items:
            type: string
          description: Datasets cloned from this snapshot
        created_at:
          $ref: "#/components/schemas/Timestamp"
        metadata:
          $ref: "#/components/schemas/Metadata"

    SnapshotCreate:
      type: object
      required: [dataset, name]
      properties:
        dataset:
          type: string
        name:
          type: string
          description: The part after `@`
          pattern: "^[a-zA-Z0-9_.:-]{1,255}$"
        recursive:
          type: boolean
          default: false
        metadata:
          $ref: "#/components/schemas/Metadata"

    SnapshotList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Snapshot"

    # ----------------------------------------------------------- network

    LinkName:
      type: string
      pattern: "^[a-zA-Z][a-zA-Z0-9_]{0,30}[0-9]$"
      description: A datalink name; illumos requires it to end in a digit

    LinkKind:
      type: string
      enum: [phys, aggr, vlan, etherstub, vnic, other]

    LinkState:
      type: string
      enum: [up, down, unknown]

    Link:
      type: object
      description: One datalink. Fields not meaningful for a kind are absent.
      required: [id, name, kind, state, protected]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LinkKind"
        state:
          $ref: "#/components/schemas/LinkState"
        over:
          type: array
          items:
            type: string
          description: Links this one sits on; several for an aggr, one otherwise
        mtu:
          type: integer
        mac:
          type: string
          description: "Colon-separated, lowercase"
        mac_mode:
          type: string
          enum: [auto, fixed, random, factory]
          description: VNICs
        vid:
          type: integer
          description: VLAN id for VLAN links and tagged VNICs
        speed_mbps:
          type: integer
          description: Physical links and aggrs
        duplex:
          type: string
          enum: [full, half, unknown]
        device:
          type: string
          description: Driver instance behind a physical link, for example `e1000g0`
        media:
          type: string
        aggr:
          $ref: "#/components/schemas/AggrInfo"
        zone:
          type: [string, "null"]
          description: Zone the link is assigned to, if not the global zone
        protected:
          type: boolean
          description: Part of the path to the management address
        metadata:
          $ref: "#/components/schemas/Metadata"

    AggrInfo:
      type: object
      required: [policy, lacp_mode, lacp_timer, ports]
      properties:
        policy:
          type: string
          description: "`L2`, `L3`, `L4`, or combinations such as `L2,L3`"
        lacp_mode:
          type: string
          enum: [off, active, passive]
        lacp_timer:
          type: string
          enum: [short, long]
        ports:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name:
                type: string
              state:
                type: string
                description: "`attached`, `standby`, or as `dladm show-aggr -x` prints it"
              speed_mbps:
                type: integer

    LinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Link"

    LinkUpdate:
      type: object
      properties:
        mtu:
          type: integer
          minimum: 576
          maximum: 9216
        metadata:
          $ref: "#/components/schemas/Metadata"

    AggrCreate:
      type: object
      required: [name, ports]
      properties:
        name:
          $ref: "#/components/schemas/LinkName"
        ports:
          type: array
          minItems: 1
          items:
            type: string
        policy:
          type: string
          default: L4
        lacp_mode:
          type: string
          enum: [off, active, passive]
          default: active
        lacp_timer:
          type: string
          enum: [short, long]
          default: short
        metadata:
          $ref: "#/components/schemas/Metadata"

    VlanCreate:
      type: object
      required: [name, vid, over]
      properties:
        name:
          $ref: "#/components/schemas/LinkName"
        vid:
          type: integer
          minimum: 1
          maximum: 4094
        over:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"

    VnicCreate:
      type: object
      required: [name, over]
      properties:
        name:
          $ref: "#/components/schemas/LinkName"
        over:
          type: string
        mac:
          type: string
          description: Pin a MAC; omitted means auto
        vid:
          type: integer
          minimum: 1
          maximum: 4094
        mtu:
          type: integer
        metadata:
          $ref: "#/components/schemas/Metadata"

    AddressKind:
      type: string
      enum: [static, dhcp, addrconf]

    Address:
      type: object
      required: [id, name, interface, kind, family, state, protected]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          description: The address object, for example `vnic0/v4`
        interface:
          type: string
          description: The link (IP interface) it belongs to
        kind:
          $ref: "#/components/schemas/AddressKind"
        family:
          type: string
          enum: [inet, inet6]
        address:
          type: string
          description: "`a.b.c.d/prefix` or `xx::/prefix`; absent until DHCP or autoconf assigns one"
        state:
          type: string
          description: "`ok`, `tentative`, `duplicate`, `inaccessible`, `disabled`, ..."
        persistent:
          type: boolean
        protected:
          type: boolean
          description: The address the daemon listens on
        metadata:
          $ref: "#/components/schemas/Metadata"

    AddressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Address"

    AddressCreate:
      type: object
      required: [interface, kind]
      properties:
        interface:
          type: string
          description: Link name; the IP interface is created if missing
        kind:
          $ref: "#/components/schemas/AddressKind"
        address:
          type: string
          description: Required for `static`, with prefix length
        alias:
          type: string
          pattern: "^[a-zA-Z0-9_]{1,16}$"
          description: The part after `/` in the address object name; default `v4` or `v6`
        temporary:
          type: boolean
          default: false
          description: Do not persist across reboot
        metadata:
          $ref: "#/components/schemas/Metadata"

    Route:
      type: object
      required: [id, destination, family, kind]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        destination:
          type: string
          description: "`default` or a network with prefix"
        gateway:
          type: string
        family:
          type: string
          enum: [inet, inet6]
        interface:
          type: string
        flags:
          type: string
          description: As `netstat -rn` prints them
        kind:
          type: string
          enum: [static, interface, dynamic]
          description: Only `static` routes are managed
        persistent:
          type: boolean

    RouteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Route"

    RouteCreate:
      type: object
      required: [destination, gateway]
      properties:
        destination:
          type: string
          description: "`default` or a network with prefix"
        gateway:
          type: string

    # ----------------------------------------------------------- images

    ImageType:
      type: string
      enum: [zone-native, zone-lx, vm-raw, vm-iso]
      description: What the image is used for; fixes the on-disk form (ADR-0012)

    ImageState:
      type: string
      enum: [pending, downloading, verifying, importing, ready, failed]

    Image:
      type: object
      description: An image on this host, in any state of import.
      required: [id, name, version, type, state, sha256, size_bytes, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        version:
          type: string
        type:
          $ref: "#/components/schemas/ImageType"
        state:
          $ref: "#/components/schemas/ImageState"
        sha256:
          type: string
          description: Hex digest of the payload as published
        size_bytes:
          type: integer
          format: int64
          description: Payload size as published
        pool:
          type: string
        dataset:
          type: string
          description: "`<pool>/images/<id>` for datasets and zvols; absent for ISO files"
        path:
          type: string
          description: File path for `vm-iso` images
        source_id:
          $ref: "#/components/schemas/Id"
        source_name:
          type: string
        url:
          type: string
          description: Where the payload was fetched from
        description:
          type: string
        os:
          type: string
          description: "Free text from the index, for example `debian-12`"
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Download or import progress while not `ready`
        error:
          type: string
          description: Why the import failed
        in_use_by:
          type: integer
          description: Zones and VMs cloned from this image
        created_at:
          $ref: "#/components/schemas/Timestamp"
        imported_at:
          $ref: "#/components/schemas/Timestamp"
        metadata:
          $ref: "#/components/schemas/Metadata"

    ImageList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Image"

    ImageImport:
      type: object
      description: |
        From a source: `source_id`, `name`, `version`. Direct: `url`,
        `sha256`, `type`, `name`, `version`. `pool` defaults per ADR-0012.
      required: [name, version]
      properties:
        source_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        version:
          type: string
        url:
          type: string
        sha256:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
        type:
          $ref: "#/components/schemas/ImageType"
        pool:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"

    CatalogueEntry:
      type: object
      description: One image a source offers.
      required: [source_id, source_name, name, version, type, url, sha256, size_bytes, imported]
      properties:
        source_id:
          $ref: "#/components/schemas/Id"
        source_name:
          type: string
        name:
          type: string
        version:
          type: string
        type:
          $ref: "#/components/schemas/ImageType"
        url:
          type: string
        sha256:
          type: string
        size_bytes:
          type: integer
          format: int64
        description:
          type: string
        os:
          type: string
        published_at:
          $ref: "#/components/schemas/Timestamp"
        imported:
          type: boolean
          description: An image with this sha256 is on the host
        image_id:
          $ref: "#/components/schemas/Id"

    CatalogueEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueEntry"

    ImageSource:
      type: object
      required: [id, name, url, enabled, builtin, verified, image_count, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        url:
          type: string
          description: "URL of `index.json`; `index.json.sig` sits beside it"
        public_key:
          type: string
          description: Base64 Ed25519 public key; absent means unverified
        enabled:
          type: boolean
        builtin:
          type: boolean
          description: Shipped with Mandrake; cannot be removed
        verified:
          type: boolean
          description: A key is set and the last index verified against it
        image_count:
          type: integer
          description: Entries in the cached catalogue
        last_refreshed_at:
          $ref: "#/components/schemas/Timestamp"
        last_error:
          type: string
          description: Why the last refresh failed
        created_at:
          $ref: "#/components/schemas/Timestamp"

    ImageSourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImageSource"

    ImageSourceCreate:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        url:
          type: string
          format: uri
        public_key:
          type: string
          description: Base64 Ed25519 public key (32 bytes)
        enabled:
          type: boolean
          default: true

    ImageSourceUpdate:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        public_key:
          type: [string, "null"]
          description: Set, or null to make the source unverified
        enabled:
          type: boolean

    # ----------------------------------------------------------- zones

    ZoneBrand:
      type: string
      enum: [ipkg, lipkg, sparse, lx]
      description: "OmniOS brands; `ipkg`, `lipkg`, and `sparse` are native"

    ZoneState:
      type: string
      enum: [configured, incomplete, installed, ready, running, shutting_down, down, unavailable]
      description: As `zoneadm list` reports it

    ZoneNic:
      type: object
      description: A zonecfg `anet` resource; the VNIC exists while the zone runs.
      required: [name, over]
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z][a-zA-Z0-9_]{0,30}[0-9]$"
          description: "Link name inside the zone, for example `net0`"
        over:
          type: string
          description: Physical link, aggregation, or etherstub beneath it
        mac:
          type: string
          description: Pinned MAC; absent means auto
        vid:
          type: integer
          minimum: 1
          maximum: 4094
        address:
          type: string
          description: "`a.b.c.d/prefix` or `xx::/prefix`, applied by the brand where it can be"
        gateway:
          type: string
          description: Default router for this address

    Zone:
      type: object
      required: [id, name, brand, state, zonepath, autoboot, nics]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        brand:
          $ref: "#/components/schemas/ZoneBrand"
        state:
          $ref: "#/components/schemas/ZoneState"
        image_id:
          $ref: "#/components/schemas/Id"
        pool:
          type: string
        dataset:
          type: string
          description: "`<pool>/zones/<name>`"
        zonepath:
          type: string
        nics:
          type: array
          items:
            $ref: "#/components/schemas/ZoneNic"
        cpu_cap:
          type: number
          description: "CPUs worth of time, for example `1.5`"
        memory_cap_bytes:
          type: integer
          format: int64
        autoboot:
          type: boolean
        hostname:
          type: string
        resolvers:
          type: array
          items:
            type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        metadata:
          $ref: "#/components/schemas/Metadata"

    ZoneList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Zone"

    ZoneCreate:
      type: object
      required: [name, brand]
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,62}$"
        brand:
          $ref: "#/components/schemas/ZoneBrand"
        image_id:
          $ref: "#/components/schemas/Id"
        pool:
          type: string
        nics:
          type: array
          items:
            $ref: "#/components/schemas/ZoneNic"
        cpu_cap:
          type: number
          exclusiveMinimum: 0
        memory_cap_bytes:
          type: integer
          format: int64
          minimum: 67108864
        autoboot:
          type: boolean
          default: true
        start:
          type: boolean
          default: true
          description: Boot once installed
        hostname:
          type: string
        resolvers:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/Metadata"

    ZoneUpdate:
      type: object
      properties:
        nics:
          type: array
          description: Replaces the whole list
          items:
            $ref: "#/components/schemas/ZoneNic"
        cpu_cap:
          type: [number, "null"]
          description: Null removes the cap
        memory_cap_bytes:
          type: [integer, "null"]
          format: int64
          description: Null removes the cap
        autoboot:
          type: boolean
        hostname:
          type: string
        resolvers:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/Metadata"

    ZoneStop:
      type: object
      properties:
        force:
          type: boolean
          default: false
          description: "`zoneadm halt` instead of a clean shutdown"

    # ----------------------------------------------------------- vms

    Bootrom:
      type: string
      enum: [uefi, uefi-csm]
      description: "`uefi` is `BHYVE_RELEASE`; `uefi-csm` adds the legacy BIOS shim"

    VmDisk:
      type: object
      description: One zvol-backed disk, in slot order.
      required: [index, dataset, size_bytes, boot]
      properties:
        index:
          type: integer
          minimum: 0
        dataset:
          type: string
          description: "`<pool>/vms/<name>/disk<N>`"
        device:
          type: string
          description: "`/dev/zvol/rdsk/...` as the brand sees it"
        size_bytes:
          type: integer
          format: int64
        boot:
          type: boolean
        image_id:
          $ref: "#/components/schemas/Id"

    VmCdrom:
      type: object
      required: [index, image_id, path]
      properties:
        index:
          type: integer
          minimum: 0
        image_id:
          $ref: "#/components/schemas/Id"
        path:
          type: string

    Vm:
      type: object
      required: [id, name, state, vcpus, memory_bytes, bootrom, acpi, disks, cdroms, nics, vnc, autoboot, zonepath]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        state:
          $ref: "#/components/schemas/ZoneState"
        vcpus:
          type: integer
          minimum: 1
        memory_bytes:
          type: integer
          format: int64
        bootrom:
          $ref: "#/components/schemas/Bootrom"
        acpi:
          type: boolean
        disks:
          type: array
          items:
            $ref: "#/components/schemas/VmDisk"
        cdroms:
          type: array
          items:
            $ref: "#/components/schemas/VmCdrom"
        nics:
          type: array
          items:
            $ref: "#/components/schemas/ZoneNic"
        vnc:
          type: boolean
          description: A VNC server runs for the guest, reachable only through the proxy
        autoboot:
          type: boolean
        pool:
          type: string
        dataset:
          type: string
        zonepath:
          type: string
        image_id:
          $ref: "#/components/schemas/Id"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        metadata:
          $ref: "#/components/schemas/Metadata"

    VmList:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Vm"

    VmDiskSpec:
      type: object
      description: A blank disk of `size_bytes`, or a clone of a `vm-raw` image.
      properties:
        size_bytes:
          type: integer
          format: int64
          minimum: 1048576
        image_id:
          $ref: "#/components/schemas/Id"
        boot:
          type: boolean
          default: false

    VmCreate:
      type: object
      required: [name, vcpus, memory_bytes, disks]
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,62}$"
        vcpus:
          type: integer
          minimum: 1
          maximum: 128
        memory_bytes:
          type: integer
          format: int64
          minimum: 134217728
        bootrom:
          $ref: "#/components/schemas/Bootrom"
        acpi:
          type: boolean
          default: true
        pool:
          type: string
        disks:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/VmDiskSpec"
          description: The first disk boots unless another has `boot`
        cdroms:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          description: "`vm-iso` images to attach"
        nics:
          type: array
          items:
            $ref: "#/components/schemas/ZoneNic"
        vnc:
          type: boolean
          default: true
        autoboot:
          type: boolean
          default: true
        start:
          type: boolean
          default: true
        metadata:
          $ref: "#/components/schemas/Metadata"

    VmUpdate:
      type: object
      properties:
        vcpus:
          type: integer
          minimum: 1
          maximum: 128
        memory_bytes:
          type: integer
          format: int64
          minimum: 134217728
        bootrom:
          $ref: "#/components/schemas/Bootrom"
        acpi:
          type: boolean
        vnc:
          type: boolean
        autoboot:
          type: boolean
        nics:
          type: array
          description: Replaces the whole list
          items:
            $ref: "#/components/schemas/ZoneNic"
        metadata:
          $ref: "#/components/schemas/Metadata"

    VmDiskAdd:
      type: object
      properties:
        size_bytes:
          type: integer
          format: int64
          minimum: 1048576
        image_id:
          $ref: "#/components/schemas/Id"

    VmDiskResize:
      type: object
      required: [size_bytes]
      properties:
        size_bytes:
          type: integer
          format: int64

    VmCdromAttach:
      type: object
      required: [image_id]
      properties:
        image_id:
          $ref: "#/components/schemas/Id"

    VmSnapshot:
      type: object
      required: [id, name, created_at, used_bytes]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          description: The part after `@`
        created_at:
          $ref: "#/components/schemas/Timestamp"
        used_bytes:
          type: integer
          format: int64
          description: Across every disk
        metadata:
          $ref: "#/components/schemas/Metadata"

    VmSnapshotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VmSnapshot"

    VmSnapshotCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,254}$"
        metadata:
          $ref: "#/components/schemas/Metadata"
