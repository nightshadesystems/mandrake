openapi: 3.1.0
info:
  title: Mandrake API
  version: 0.1.0
  summary: Host management API for the Mandrake hypervisor OS
  description: |
    HTTP+JSON API served by `mandraked`. This file is the contract and the
    source of truth for API shape (spec §6.3, §14). `docs/api.md` is generated
    from it.

    Conventions: plural nouns, UUID identifiers, cursor pagination,
    `Idempotency-Key` on POST, `202` with a Job for long operations, RFC 7807
    problem details for errors. Timestamps are RFC 3339 in UTC.

    Authentication (ADR-0007): a session cookie issued by `POST /auth/login`
    for the console, or a bearer token for API and CLI use. Requests that
    mutate state and are authenticated by cookie must also send the header
    `X-Mandrake-Request: 1`. The same API is served on the Unix socket
    `/var/run/mandrake/mandraked.sock`, where uid 0 is trusted without auth
    so `mandrakectl` works for recovery with no network (spec §9).

    Roles: `viewer` reads; `operator` also mutates infrastructure; `admin`
    also manages users, tokens, and the system. Each operation lists the
    minimum role in its description.

    Surface so far: `health`, `auth`, `system`, `users`, `tokens`, `audit`,
    `jobs`, `events` (Phase 2); `storage` and `network` (Phase 3); `images`
    and `zones` (Phase 4); `vms` (Phase 5).
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Nightshade Systems
    url: https://nightshade.systems

servers:
  - url: https://{host}/api/v1
    description: Console and API over HTTPS
    variables:
      host:
        default: mandrake.local

security:
  - sessionCookie: []
  - bearerToken: []

tags:
  - name: health
    description: Liveness, unauthenticated
  - name: auth
    description: Console login, logout, and the current session
  - name: system
    description: Host identity, time, resources, boot environments
  - name: boot-environments
    description: beadm boot environments (ADR-0015)
  - name: updates
    description: pkg updates into a new boot environment (ADR-0015)
  - name: users
    description: Local users and roles
  - name: tokens
    description: API bearer tokens
  - name: audit
    description: Audit log of mutating calls
  - name: jobs
    description: Long-running operations
  - name: events
    description: Event stream over WebSocket
  - name: network
    description: "Crossbow objects: links, vnics, aggrs, vlans, etherstubs, addresses, routes"
  - name: storage
    description: ZFS pools, datasets, volumes, snapshots
  - name: images
    description: Image catalogue and sources
  - name: zones
    description: Native and lx zones
  - name: vms
    description: bhyve virtual machines and console proxies

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness check
      description: Returns 204 when the daemon is serving. No authentication, no body.
      security: []
      responses:
        "204":
          description: Alive

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with username and password
      description: |
        Issues a session cookie. Five failures within fifteen minutes lock
        the user for fifteen minutes; ten attempts a minute from one address
        are rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "`mandrake_session=...; HttpOnly; Secure; SameSite=Strict; Path=/`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        "423":
          description: User locked after repeated failures
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: Deletes the session behind the cookie. Bearer tokens are not affected.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Session ended; the cookie is cleared
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The current actor
      description: Works for sessions, tokens, and the root socket. Any role.
      responses:
        "200":
          description: Current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /system:
    get:
      tags: [system]
      operationId: getSystem
      summary: Host identity
      description: Any role.
      responses:
        "200":
          description: Host identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [system]
      operationId: updateSystem
      summary: Change host settings
      description: |
        Role `admin`. Hostname (applied at once: `hostname`, `/etc/nodename`,
        `/etc/inet/hosts`, `svc:/system/identity:node`), timezone
        (`svc:/system/timezone`), and NTP servers (`/etc/inet/chrony.conf`
        and a restart of chrony). Absent fields are unchanged (ADR-0015).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemUpdate"
      responses:
        "200":
          description: Host identity after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /system/resources:
    get:
      tags: [system]
      operationId: getSystemResources
      summary: CPU, memory, and load
      description: Point-in-time figures for dashboard gauges. Any role.
      responses:
        "200":
          description: Resource figures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemResources"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /system/settings:
    get:
      tags: [system]
      operationId: getSystemSettings
      summary: Host settings
      description: Hostname, timezone, and NTP servers as configured. Any role.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /system/tls:
    get:
      tags: [system]
      operationId: getSystemTls
      summary: The console certificate
      description: Subject, issuer, validity, fingerprint, and whether it is self-signed. Any role.
      responses:
        "200":
          description: Certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsInfo"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [system]
      operationId: putSystemTls
      summary: Install a certificate
      description: |
        Role `admin`. A PEM certificate chain and its private key. Both are
        parsed, the key must match the leaf, the previous pair is kept as a
        backup, and the listener reloads in place (ADR-0015). Clients that
        pin the fingerprint must update it from the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TlsUpload"
      responses:
        "200":
          description: Installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsInfo"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [system]
      operationId: resetSystemTls
      summary: Back to a self-signed certificate
      description: Role `admin`. Generates a new self-signed pair and reloads the listener.
      responses:
        "200":
          description: The new certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsInfo"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /system/reboot:
    post:
      tags: [system]
      operationId: rebootSystem
      summary: Reboot the host
      description: |
        Role `admin`. Audited first; then `shutdown -y -g 0 -i 6` after a
        short grace so this response reaches the client. The job resource
        outlives nothing: the daemon stops with the host (ADR-0015).
      responses:
        "202":
          description: Reboot scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /system/boot-environments:
    get:
      tags: [boot-environments]
      operationId: listBootEnvironments
      summary: List boot environments
      description: From `beadm list -H`; the active and the booted BE are flagged. Any role.
      responses:
        "200":
          description: Boot environments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootEnvironmentList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [boot-environments]
      operationId: createBootEnvironment
      summary: Create a boot environment
      description: Role `admin`. A snapshot of the active BE under a new name (`beadm create`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootEnvironmentCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootEnvironment"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /system/boot-environments/{name}:
    parameters:
      - $ref: "#/components/parameters/BootEnvironmentName"
    get:
      tags: [boot-environments]
      operationId: getBootEnvironment
      summary: One boot environment
      description: Any role.
      responses:
        "200":
          description: Boot environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootEnvironment"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [boot-environments]
      operationId: deleteBootEnvironment
      summary: Destroy a boot environment
      description: Role `admin`. Refused for the active or the booted BE (`beadm destroy -F`).
      responses:
        "204":
          description: Destroyed
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /system/boot-environments/{name}/activate:
    parameters:
      - $ref: "#/components/parameters/BootEnvironmentName"
    post:
      tags: [boot-environments]
      operationId: activateBootEnvironment
      summary: Activate a boot environment
      description: |
        Role `admin`. `beadm activate`: the BE boots next. Rolling back an
        update is activating the previous BE and calling `/system/reboot`.
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootEnvironment"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /system/updates:
    get:
      tags: [updates]
      operationId: getUpdates
      summary: Update state
      description: |
        The last check's plan and time, whether an apply is running or has
        completed, and the previously active BE for a rollback. Any role.
      responses:
        "200":
          description: Update state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateState"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /system/updates/check:
    post:
      tags: [updates]
      operationId: checkUpdates
      summary: Check for updates
      description: |
        Role `admin`. A job: `pkg refresh --full`, then `pkg update -nv`
        parsed into a plan stored with the check time (ADR-0015).
      responses:
        "202":
          description: Check started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /system/updates/apply:
    post:
      tags: [updates]
      operationId: applyUpdates
      summary: Apply the planned update
      description: |
        Role `admin`. A job: `pkg update -v --be-name <name>` into a new
        boot environment, which pkg activates. Refused with 409 while
        another apply runs, and with 422 when there is no plan or it
        predates the last refresh. Nothing reboots; call `/system/reboot`.
      responses:
        "202":
          description: Apply started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"


  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: Any role.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: Role `admin`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Username already exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      description: Any role.
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update a user
      description: |
        Role `admin`. An admin cannot remove their own `admin` role or
        disable themselves; the last enabled admin cannot be disabled.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        Role `admin`. Ends the user's sessions and revokes their tokens.
        Audit rows keep the username. The last enabled admin cannot be
        deleted, nor can the caller delete themselves.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [users]
      operationId: setUserPassword
      summary: Set a user's password
      description: |
        Any role for one's own account, with `current_password` required.
        Role `admin` for any account, without `current_password`. Ends every
        other session of that user.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: List tokens
      description: |
        Any role lists their own tokens. Role `admin` may pass `user_id` to
        list another user's. Secrets are never returned.
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create a token
      description: |
        Any role creates a token for themselves; role `admin` may set
        `user_id` to create one for another user. The secret is returned
        once, in this response only.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
      responses:
        "201":
          description: Created; `secret` is shown only here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [tokens]
      operationId: getToken
      summary: Get a token's metadata
      description: Owner or role `admin`.
      responses:
        "200":
          description: The token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [tokens]
      operationId: deleteToken
      summary: Revoke a token
      description: Owner or role `admin`. Takes effect immediately.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: List audit entries, newest first
      description: Any role. Entries are immutable.
      parameters:
        - name: actor_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Id"
        - name: object_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Id"
        - name: action
          in: query
          required: false
          description: Exact action name, for example `user.create`
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: List jobs, newest first
      description: Any role.
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobState"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get a job
      description: Any role.
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Event stream (WebSocket)
      description: |
        Upgrade to a WebSocket. Each text frame from the server is one
        `Event` as JSON. Authenticate with the session cookie or with the
        bearer token in the `Authorization` header of the upgrade request.
        Optional `since` replays events with a greater id first. Any role.
        Clients send nothing; pings are handled by the protocol.
      parameters:
        - name: since
          in: query
          required: false
          description: Event id to resume after
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  # ------------------------------------------------------------- storage

  /storage/devices:
    get:
      tags: [storage]
      operationId: listDevices
      summary: Disks on the host
      description: |
        Every block device the host sees, with the pool that uses it when
        one does. Source for the pool creation flow. Any role.
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /storage/pools:
    get:
      tags: [storage]
      operationId: listPools
      summary: List pools
      description: Any role. `rpool` is included and marked protected.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of pools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [storage]
      operationId: createPool
      summary: Create a data pool
      description: |
        Role `operator`. Runs `zpool create` with the given vdev layout.
        Devices already in a pool are refused unless `force` is set.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pool"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /storage/pools/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [storage]
      operationId: getPool
      summary: Pool with vdev layout, health, and scan status
      description: Any role.
      responses:
        "200":
          description: The pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pool"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [storage]
      operationId: updatePool
      summary: Update pool metadata
      description: Role `operator`. Only Mandrake metadata; pool properties are not exposed in this phase.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Metadata"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pool"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [storage]
      operationId: destroyPool
      summary: Destroy a pool
      description: |
        Role `admin`. The body must echo the pool name (spec §7). `rpool`
        is refused with the `protected` problem. Destroys every dataset in
        the pool.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolDestroy"
      responses:
        "204":
          description: Destroyed
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /storage/pools/{id}/scrub:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [storage]
      operationId: startScrub
      summary: Start a scrub
      description: Role `operator`. Returns a job that tracks the scrub to completion.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: A scrub or resilver is already running
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [storage]
      operationId: stopScrub
      summary: Stop a running scrub
      description: Role `operator`.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Stopped
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /storage/datasets:
    get:
      tags: [storage]
      operationId: listDatasets
      summary: List filesystems and volumes
      description: Any role. Filter by pool, parent, or kind.
      parameters:
        - name: pool
          in: query
          required: false
          schema:
            type: string
        - name: parent
          in: query
          required: false
          description: Only direct children of this dataset name
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DatasetKind"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of datasets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [storage]
      operationId: createDataset
      summary: Create a filesystem or volume
      description: Role `operator`. Volumes need `volsize_bytes`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /storage/datasets/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [storage]
      operationId: getDataset
      summary: Get a dataset
      description: Any role.
      responses:
        "200":
          description: The dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [storage]
      operationId: updateDataset
      summary: Change properties or metadata
      description: |
        Role `operator`. Volumes may grow (`volsize_bytes` larger than now);
        shrinking is refused. Mandrake metadata may be set on any dataset,
        including protected ones.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [storage]
      operationId: destroyDataset
      summary: Destroy a dataset
      description: |
        Role `operator`. Refused when the dataset has children or
        snapshots unless `recursive` is set, or when it is protected.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
        - name: recursive
          in: query
          required: false
          description: Also destroy children and snapshots (`zfs destroy -r`)
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Destroyed
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: Has children or snapshots and `recursive` was not set
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /storage/volumes:
    get:
      tags: [storage]
      operationId: listVolumes
      summary: List volumes (zvols)
      description: The `kind=volume` view of datasets. Any role.
      parameters:
        - name: pool
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of volumes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /storage/snapshots:
    get:
      tags: [storage]
      operationId: listSnapshots
      summary: List snapshots
      description: Any role. Filter by the dataset they belong to.
      parameters:
        - name: dataset
          in: query
          required: false
          description: Dataset name; with `recursive` also descendants
          schema:
            type: string
        - name: recursive
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [storage]
      operationId: createSnapshot
      summary: Take a snapshot
      description: Role `operator`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /storage/snapshots/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [storage]
      operationId: getSnapshot
      summary: Get a snapshot
      description: Any role.
      responses:
        "200":
          description: The snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [storage]
      operationId: destroySnapshot
      summary: Destroy a snapshot
      description: Role `operator`. Refused when clones depend on it.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Destroyed
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /storage/snapshots/{id}/rollback:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [storage]
      operationId: rollbackSnapshot
      summary: Roll the dataset back to this snapshot
      description: |
        Role `operator`. Refused when newer snapshots exist unless
        `discard_newer` is set (`zfs rollback -r`).
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                discard_newer:
                  type: boolean
                  default: false
      responses:
        "204":
          description: Rolled back
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /storage/snapshots/{id}/clone:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [storage]
      operationId: cloneSnapshot
      summary: Clone a snapshot into a new dataset
      description: Role `operator`. How images become VM disks and zone roots (spec §7).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Full name of the new dataset
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

