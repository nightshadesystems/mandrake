[package]
name = "mandraked"
description = "Mandrake host management daemon: API server, auth, audit, embedded console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "mandraked"
path = "src/main.rs"

[dependencies]
mandrake-core = { workspace = true }
mandrake-zfs = { workspace = true }

argon2 = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
rust-embed = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[features]
default = []
# Compile SQLite in even on illumos. Only for cross builds on hosts whose
# illumos sysroot has no libsqlite3 (the build workflow); packages built on
# the OmniOS build host keep the system library (ADR-0009).
bundled-sqlite = ["rusqlite/bundled"]

# ADR-0009: the OmniOS libsqlite3 on illumos, a bundled copy elsewhere.
[target.'cfg(target_os = "illumos")'.dependencies]
rusqlite = { workspace = true }

[target.'cfg(not(target_os = "illumos"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

# The root Unix socket (ADR-0007) is served straight over hyper.
[target.'cfg(unix)'.dependencies]
hyper = { workspace = true }
hyper-util = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
